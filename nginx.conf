# ============================================================
# plus.tasimo.uz — nginx (faqat HTTP)
# HTTPS'ni server oldidagi Kerio Control qo'llaydi: certbot, 443 bloki va http→https yo'naltirish KERAK EMAS.
#
# O'rnatish (serverda, repo papkasidan):
#   sudo cp nginx.conf /etc/nginx/sites-available/plus.tasimo.uz
#   sudo ln -sf /etc/nginx/sites-available/plus.tasimo.uz /etc/nginx/sites-enabled/plus.tasimo.uz
#   sudo nginx -t && sudo systemctl reload nginx
# ============================================================

# Mijozning haqiqiy IP'si YO'Q: bitta oq IP, oldida Kerio Control (NAT) — nginx hamma so'rovni Kerio manzilidan ko'radi.
# Shuning uchun IP bo'yicha cheklov (limit_req/limit_conn $binary_remote_addr) amalda BUTUN sayt uchun umumiy bo'ladi —
# bunday cheklov faqat muharrir kirishida, ochiqchasiga umumiy kalit bilan. Backend ham noto'g'ri urinishlarni umumiy
# sanaydi (15 daqiqada 20 ta), tugma va tashrif kuzatuvi esa tashrifchi ID (cookie) bo'yicha cheklanadi.

# Muharrir paroli: butun sayt bo'yicha daqiqasiga 10 so'rov
limit_req_zone $server_name zone=plus_editor_login:1m rate=10r/m;

# Next.js (PM2: plus.tasimo.uz, port 3101)
upstream plus_tasimo {
    server 127.0.0.1:3101 max_fails=3 fail_timeout=10s;
    keepalive 16;
}

server {
    listen 80;
    server_name plus.tasimo.uz;

    # Kerio orqasida nginx o'zi yo'naltirganda http:// li to'liq manzil yozmasin
    absolute_redirect off;

    # Muharrirda rasm yuklash (8 MB) va qoralama (1 MB)
    client_max_body_size 10m;

    access_log /var/log/nginx/plus_access.log combined;
    error_log /var/log/nginx/plus_error.log warn;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # Kerio ortida bu ikkisi mijozning emas, Kerio'ning manzili — sayt ularni cheklov yoki statistika uchun ishlatmaydi
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Muharrir CSRF tekshiruvi (sameOrigin) Origin hostini shu bilan solishtiradi
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /api/editor/login {
        limit_req zone=plus_editor_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://plus_tasimo;
    }

    location / {
        proxy_pass http://plus_tasimo;
    }
}
