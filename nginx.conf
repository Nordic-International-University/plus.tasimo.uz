# ============================================================
# plus.tasimo.uz — nginx (faqat HTTP)
# HTTPS'ni server oldidagi Kerio Control qo'llaydi: certbot, 443 bloki va http→https yo'naltirish KERAK EMAS.
#
# O'rnatish (serverda, repo papkasidan):
#   sudo cp nginx.conf /etc/nginx/sites-available/plus.tasimo.uz
#   sudo ln -sf /etc/nginx/sites-available/plus.tasimo.uz /etc/nginx/sites-enabled/plus.tasimo.uz
#   sudo nginx -t && sudo systemctl reload nginx
# ============================================================

# Muharrir paroli: IP bo'yicha daqiqasiga 10 urinish (backend'da ham bor: 15 daqiqada 8 urinish)
limit_req_zone $binary_remote_addr zone=plus_editor_login:10m rate=10r/m;

# Next.js (PM2: plus.tasimo.uz, port 3101)
upstream plus_tasimo {
    server 127.0.0.1:3101 max_fails=3 fail_timeout=10s;
    keepalive 16;
}

server {
    listen 80;
    server_name plus.tasimo.uz;

    # Kerio orqasida nginx o'zi yo'naltirganda http:// li to'liq manzil yozmasin
    absolute_redirect off;

    # Klient IP Kerio'ning X-Forwarded-For'idan olinadi. Global nginx.conf (http {}) da allaqachon bo'lmasa — yoqing.
    # Faqat Kerio manzili(lari)ni yozing, hech qachon 0.0.0.0/0:
    # set_real_ip_from <KERIO_IP>;
    # real_ip_header X-Forwarded-For;
    # real_ip_recursive on;

    # Muharrirda rasm yuklash (8 MB) va qoralama (1 MB)
    client_max_body_size 10m;

    access_log /var/log/nginx/plus_access.log combined;
    error_log /var/log/nginx/plus_error.log warn;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Tugma kuzatuvi va muharrir kirishidagi IP cheklovi shu sarlavhaning birinchi qiymatini oladi
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Muharrir CSRF tekshiruvi (sameOrigin) Origin hostini shu bilan solishtiradi
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /api/editor/login {
        limit_req zone=plus_editor_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://plus_tasimo;
    }

    location / {
        proxy_pass http://plus_tasimo;
    }
}
